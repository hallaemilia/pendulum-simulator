name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Package import sanity
        run: python -c "import pendulum_counterfactuals; print(pendulum_counterfactuals.__version__)"
      - name: CLI --help
        run: |
          pendulum-cf --help
          pendulum-cf generate --help
          pendulum-cf verify --help
          pendulum-cf render --help
      - name: Run test suite
        run: python -m pytest tests -q
